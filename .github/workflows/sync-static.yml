name: Sync static branch from upstream
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout upstream static branch
        uses: actions/checkout@v4
        with:
          repository: LibreSpark/LibreTV
          ref: static
          fetch-depth: 0
      - name: Force push to this repo static branch
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin static:static --force
